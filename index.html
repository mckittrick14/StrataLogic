<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strata Sentinel | Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0ea5e9;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-blue); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
        }
        .card h3 { margin-top: 0; color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric { font-size: 2rem; font-weight: bold; margin: 0.5rem 0 0 0; color: var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <h1>Strata Sentinel</h1>
        <p style="margin: 0; color: var(--text-muted);">System Status: <span style="color: var(--accent-green);">● Online</span></p>
    </header>

    <main class="grid">
        <div class="card">
            <h3>Air Quality Index</h3>
            <p class="metric">42 <span style="font-size: 1rem; color: var(--text-muted);">AQI</span></p>
        </div>
        <div class="card">
            <h3>Ambient Noise</h3>
            <p class="metric">38.4 <span style="font-size: 1rem; color: var(--text-muted);">dB</span></p>
        </div>
        <div class="card">
            <h3>Light Level</h3>
            <p class="metric">1,250 <span style="font-size: 1rem; color: var(--text-muted);">Lux</span></p>
        </div>
    </main>

</body>
</html>
